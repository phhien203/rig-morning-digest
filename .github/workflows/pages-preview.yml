name: Manual Pages preview

on:
  workflow_dispatch:
    inputs:
      include_marker:
        description: Include the lane marker (publish only after human approval)
        type: boolean
        default: true
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - name: Export digest
        env:
          INCLUDE_MARKER: ${{ inputs.include_marker }}
          LANE_MARKER: ${{ inputs.include_marker && secrets.LANE_MARKER || '' }}
        shell: bash
        run: |
          if [[ "$INCLUDE_MARKER" == true ]]; then
            if [[ -z "$LANE_MARKER" ]]; then
              echo 'Marked deployment requires the LANE_MARKER repository secret.' >&2
              exit 1
            fi
          else
            unset LANE_MARKER
          fi
          scripts/export-preview.sh "$RUNNER_TEMP/pages-preview"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-preview
          retention-days: 1
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
